<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi niña hermosa</title>
    
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Chewy&family=Pacifico&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb, #fbc2eb, #ffe2e2);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100dvh; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Chewy', cursive;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- CONTROL DE PANTALLAS --- */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-in-out, visibility 1s;
            z-index: 2;
        }
        
        .screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* --- PANTALLA 1: TARJETA --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 40px;
            padding: clamp(25px, 5vh, 40px) clamp(15px, 4vw, 30px);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), inset 0 0 30px rgba(255, 255, 255, 0.5);
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: popIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, floatCard 6s ease-in-out infinite alternate;
        }

        .images-container {
            position: relative;
            width: 180px;
            height: 160px;
            margin-bottom: 5px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 65%);
            border-radius: 50%;
        }

        .snoopy-img {
            width: 150px;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            mix-blend-mode: screen; 
            animation: floatSnoopy 3.5s ease-in-out infinite;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.4));
        }

        .girl-name {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.8rem, 11vw, 4rem);
            color: #ff3366;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.6), 2px 2px 0px #fff;
            transform: rotate(-3deg);
            margin-bottom: 5px;
            animation: pulseName 2.5s infinite alternate;
            line-height: 1;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: clamp(2.1rem, 7.5vw, 3rem);
            color: #FFD700;
            -webkit-text-stroke: 1.5px #2d3748;
            text-shadow: 3px 3px 0px #2d3748, 0 0 15px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
            margin-top: 5px;
            line-height: 1.1;
            letter-spacing: 1px;
        }

        .action-btn {
            margin-top: 25px;
            padding: 15px 30px;
            font-family: 'Chewy', cursive;
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            color: #fff;
            background: linear-gradient(45deg, #ff3366, #ff7a99);
            border: 2px solid #fff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 51, 102, 0.4), inset 0 -4px 0 rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            animation: pulseButton 2s infinite;
        }
        
        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 5px 10px rgba(255, 51, 102, 0.4), inset 0 -1px 0 rgba(0,0,0,0.2);
        }

        /* --- PANTALLA 2: CORAZÓN DE FLORES --- */
        .final-message {
            position: absolute;
            top: 10%;
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3.5rem, 14vw, 5.5rem);
            color: #ff3366;
            text-shadow: 0 0 25px rgba(255, 51, 102, 0.9), 3px 3px 0px #fff;
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            transition: all 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        .final-message.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            animation: heartbeatFinal 2s infinite alternate 1.5s;
        }

        /* Contenedor central del corazón */
        #flower-heart {
            position: relative;
            width: 0;
            height: 0;
            top: 10%; /* Ajuste vertical */
            /* La animación de latido se añade vía JS cuando termina de dibujarse */
        }

        .heartbeat-active {
            animation: pulseHeartShape 2s infinite alternate;
        }

        /* Cada flor individual dentro del corazón */
        .heart-flower {
            position: absolute;
            margin-left: -70px; /* Centrar respecto a los 140px del girasol */
            margin-top: -70px;
            transform: scale(0);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Componentes del Girasol */
        .sunflower-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spinSlowly 20s linear infinite;
        }

        .sunflower-center {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #5c3a21 30%, #291506 90%);
            border-radius: 50%;
            z-index: 10;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 0 15px rgba(255, 215, 0, 0.5);
            background-image: radial-gradient(#3a210f 15%, transparent 16%), radial-gradient(#3a210f 15%, transparent 16%);
            background-size: 8px 8px;
            background-position: 0 0, 4px 4px;
        }

        .petal {
            position: absolute;
            width: 22px;
            height: 75px;
            background: linear-gradient(180deg, #FFEA00 0%, #FF9D00 100%);
            border-radius: 50% 50% 20% 20%;
            transform-origin: bottom center;
            top: -10px;
            box-shadow: 0 0 5px rgba(255, 165, 0, 0.4);
            border: 1px solid rgba(255, 140, 0, 0.3);
        }

        /* --- KEYFRAMES --- */
        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }
        @keyframes floatSnoopy {
            0%, 100% { transform: translate(-50%, 0) rotate(0deg); }
            50% { transform: translate(-50%, -15px) rotate(3deg); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes spinSlowly {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseName {
            0% { transform: rotate(-3deg) scale(1); }
            100% { transform: rotate(-1deg) scale(1.05); text-shadow: 0 0 20px rgba(255, 51, 102, 0.9), 2px 2px 0px #fff; }
        }
        @keyframes pulseButton {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 20px rgba(255, 51, 102, 0.4), inset 0 -4px 0 rgba(0,0,0,0.2); }
            50% { transform: scale(1.03); box-shadow: 0 15px 25px rgba(255, 51, 102, 0.6), inset 0 -4px 0 rgba(0,0,0,0.2); }
        }
        @keyframes heartbeatFinal {
            0% { transform: scale(1); text-shadow: 0 0 25px rgba(255, 51, 102, 0.9), 3px 3px 0px #fff; }
            100% { transform: scale(1.08); text-shadow: 0 0 40px rgba(255, 51, 102, 1), 3px 3px 0px #fff; }
        }
        @keyframes pulseHeartShape {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }
    </style>
</head>
<body>

    <!-- Lluvia de partículas globales (Fondo) -->
    <canvas id="petalsCanvas"></canvas>

    <!-- === PANTALLA 1: Inicio === -->
    <div id="screen-1" class="screen">
        <div class="glass-card">
            <div class="images-container">
                <img src="./img/Snoopy-PNG.png" alt="Snoopy con corazón" class="snoopy-img">
            </div>

            <div class="girl-name">para mi niña hermosa</div>
            <h1>¡Feliz día de las flores amarillas!</h1>
            
            <button id="btn-grow" class="action-btn">mira tus flores amarillas</button>
        </div>
    </div>

    <!-- === PANTALLA 2: Corazón de Flores === -->
    <div id="screen-2" class="screen hidden">
        <h2 id="final-text" class="final-message">Te amo demasiado</h2>
        
        <!-- Aquí se inyectarán los girasoles mediante matemáticas en JS -->
        <div id="flower-heart"></div>
    </div>

    <script>
        // --- 1. GENERADOR DE CORAZÓN DE FLORES ---
        const heartContainer = document.getElementById('flower-heart');
        const numFlowers = 36; // Cantidad de girasoles que forman el corazón
        const flowersArray = [];

        // Ecuación paramétrica para dibujar un corazón
        for (let i = 0; i < numFlowers; i++) {
            const t = (i / numFlowers) * Math.PI * 2;
            
            // Escala dependiendo de si es móvil o PC
            const scale = window.innerWidth < 450 ? 8.5 : 11; 
            
            // Fórmulas matemáticas para la forma de corazón
            const x = scale * (16 * Math.pow(Math.sin(t), 3));
            const y = -scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

            // Crear el contenedor de la flor
            const flowerWrapper = document.createElement('div');
            flowerWrapper.className = 'heart-flower';
            flowerWrapper.style.left = `${x}px`;
            flowerWrapper.style.top = `${y}px`;

            // Construir el girasol (Centro + Pétalos)
            const head = document.createElement('div');
            head.className = 'sunflower-container';
            
            const center = document.createElement('div');
            center.className = 'sunflower-center';
            head.appendChild(center);

            for (let p = 0; p < 16; p++) { // 16 pétalos por mini-flor
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.transform = `rotate(${(360/16)*p}deg)`;
                head.appendChild(petal);
            }

            flowerWrapper.appendChild(head);
            heartContainer.appendChild(flowerWrapper);
            flowersArray.push(flowerWrapper);
        }


        // --- 2. SISTEMA DE TRANSICIÓN Y BOTÓN ---
        document.getElementById('btn-grow').addEventListener('click', () => {
            document.getElementById('screen-1').classList.add('hidden');
            document.getElementById('screen-2').classList.remove('hidden');

            // Aparecer las flores secuencialmente dibujando el corazón
            flowersArray.forEach((flower, index) => {
                setTimeout(() => {
                    // El transform final aplica la escala correcta para el tamaño de las flores
                    flower.style.transform = window.innerWidth < 450 ? 'scale(0.35)' : 'scale(0.45)';
                }, 300 + (index * 70)); // Retraso en milisegundos por flor
            });

            // Una vez dibujado el corazón, activar el latido global y el texto
            const totalDrawTime = 300 + (numFlowers * 70);
            setTimeout(() => {
                heartContainer.classList.add('heartbeat-active');
                document.getElementById('final-text').classList.add('show');
                
                // Explosión extra de corazones
                for (let i = 0; i < 40; i++) {
                    particlesArray.push(new Heart());
                }
            }, totalDrawTime + 400);
        });


        // --- 3. SISTEMA DE PARTÍCULAS CANVAS (Lluvia) ---
        const canvas = document.getElementById('petalsCanvas');
        const ctx = canvas.getContext('2d');
        
        let cw, ch;
        const particlesArray = [];
        
        function resizeCanvas() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Petal {
            constructor() {
                this.x = Math.random() * cw;
                this.y = Math.random() * ch - ch; 
                this.w = Math.random() * 10 + 8; 
                this.h = Math.random() * 15 + 12; 
                this.speedY = Math.random() * 1.5 + 1; 
                this.speedX = Math.random() * 2 - 1; 
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.04 - 0.02; 
                const colors = ['#FFD700', '#FFC107', '#FFEB3B', '#FBC02D', '#FFB300'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 4;
                ctx.shadowColor = this.color;
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(this.w / 2, this.h / 3, this.w / 2, (2 * this.h) / 3, 0, this.h);
                ctx.bezierCurveTo(-this.w / 2, (2 * this.h) / 3, -this.w / 2, this.h / 3, 0, 0);
                ctx.fill();
                ctx.closePath();
                ctx.restore();
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.angle) * 1.2 + this.speedX; 
                this.angle += this.spin;
                if (this.y > ch + this.h) {
                    this.y = -this.h;
                    this.x = Math.random() * cw;
                }
                if (this.x > cw + this.w) this.x = -this.w;
                else if (this.x < -this.w) this.x = cw + this.w;
                this.draw();
            }
        }

        class Heart {
            constructor() {
                this.x = Math.random() * cw;
                this.y = Math.random() * ch + ch; 
                this.size = Math.random() * 8 + 6; 
                this.speedY = -(Math.random() * 1.5 + 1); 
                this.speedX = Math.random() * 1.5 - 0.75;
                this.opacity = Math.random() * 0.6 + 0.4; 
                const colors = ['rgba(255, 215, 0,', 'rgba(255, 235, 59,', 'rgba(255, 193, 7,'];
                this.baseColor = colors[Math.floor(Math.random() * colors.length)];
                this.pulse = Math.random() * Math.PI;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                const scale = 1 + Math.sin(this.pulse) * 0.15;
                ctx.scale(scale, scale);
                ctx.beginPath();
                ctx.fillStyle = `${this.baseColor}${this.opacity})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = `${this.baseColor}0.8)`;
                
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(0, -3, -5, -15, -15, -15);
                ctx.bezierCurveTo(-30, -15, -30, -2.5, -30, -2.5);
                ctx.bezierCurveTo(-30, 9, -15, 20.2, 0, 30);
                ctx.bezierCurveTo(15, 20.2, 30, 9, 30, -2.5);
                ctx.bezierCurveTo(30, -2.5, 30, -15, 15, -15);
                ctx.bezierCurveTo(5, -15, 0, -3, 0, 0);
                
                ctx.scale(this.size/30, this.size/30);
                ctx.fill();
                ctx.closePath();
                ctx.restore();
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.015) * 0.8 + this.speedX; 
                this.pulse += 0.06;
                if (this.y < -50) {
                    this.y = ch + 50;
                    this.x = Math.random() * cw;
                }
                this.draw();
            }
        }

        function initParticles() {
            for (let i = 0; i < 35; i++) particlesArray.push(new Petal()); 
            for (let i = 0; i < 15; i++) particlesArray.push(new Heart()); 
        }

        function animateParticles() {
            ctx.clearRect(0, 0, cw, ch);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
