<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport optimizado para móviles (evita el zoom táctil para sentirse como una app) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Para Dani! - Flores Amarillas</title>
    
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Chewy&family=Pacifico&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Evita resaltados azules al tocar en móviles */
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            /* Degradado animado premium */
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb, #fbc2eb, #ffe2e2);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            /* 100dvh es clave para móviles: adapta el alto ignorando la barra de direcciones de Safari/Chrome */
            min-height: 100dvh; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Chewy', cursive;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Tarjeta de cristal adaptada para pantallas estrechas (iPhone) */
        .glass-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 40px;
            /* Padding fluido: más pequeño en móviles, más grande en escritorio */
            padding: clamp(25px, 5vh, 40px) clamp(15px, 4vw, 30px);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), inset 0 0 30px rgba(255, 255, 255, 0.5);
            width: 90%;
            max-width: 420px; /* Ancho ideal para un iPhone Max/Pro */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: popIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, floatCard 6s ease-in-out infinite alternate;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 40px;
            border: 1.5px solid transparent;
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            pointer-events: none;
        }

        .images-container {
            position: relative;
            width: 180px;
            height: 160px;
            margin-bottom: 5px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 65%);
            border-radius: 50%;
        }

        .snoopy-img {
            width: 150px;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            mix-blend-mode: screen; 
            animation: floatSnoopy 3.5s ease-in-out infinite;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.4));
        }

        /* Tipografía fluida usando 'clamp' para auto-ajustarse al iPhone */
        .dani-name {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3rem, 12vw, 4.2rem);
            color: #ff3366;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.6), 2px 2px 0px #fff;
            transform: rotate(-5deg);
            margin-bottom: 5px;
            animation: pulseName 2.5s infinite alternate;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: clamp(2.4rem, 9vw, 3.5rem);
            color: #FFD700;
            -webkit-text-stroke: 1.5px #2d3748;
            text-shadow: 3px 3px 0px #2d3748, 0 0 15px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
            line-height: 1.1;
            letter-spacing: 1px;
        }

        p {
            font-family: 'Pacifico', cursive;
            font-size: clamp(1.1rem, 4.5vw, 1.4rem);
            color: #2d3748;
            line-height: 1.3;
            margin-bottom: 25px;
            text-shadow: 1px 1px 3px rgba(255,255,255,1);
            padding: 0 10px;
            position: relative;
        }

        p::before, p::after {
            content: '✨';
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            position: absolute;
            opacity: 0.8;
            color: #ffb300;
        }
        p::before { top: -10px; left: -5px; }
        p::after { bottom: -10px; right: -5px; }

        /* Contenedor del girasol escalado para móviles */
        .sunflower-wrapper {
            transform: scale(0.85); /* Lo hace un poco más pequeño para que quepa perfecto en vertical */
            margin-top: -10px;
        }

        .sunflower-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spinSlowly 20s linear infinite;
        }

        .sunflower-center {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #5c3a21 30%, #291506 90%);
            border-radius: 50%;
            z-index: 10;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.6), 0 0 25px rgba(255, 215, 0, 0.4);
            background-image: radial-gradient(#3a210f 15%, transparent 16%), radial-gradient(#3a210f 15%, transparent 16%);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
        }

        .petal {
            position: absolute;
            width: 26px;
            height: 85px;
            background: linear-gradient(180deg, #FFEA00 0%, #FF9D00 100%);
            border-radius: 50% 50% 20% 20%;
            transform-origin: bottom center;
            top: -20px;
            box-shadow: 0 0 6px rgba(255, 165, 0, 0.4);
            border: 1px solid rgba(255, 140, 0, 0.3);
            transition: all 0.3s ease;
        }

        /* --- Animaciones Keyframes --- */
        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        @keyframes floatSnoopy {
            0%, 100% { transform: translate(-50%, 0) rotate(0deg); }
            50% { transform: translate(-50%, -15px) rotate(3deg); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes spinSlowly {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.05); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        @keyframes pulseName {
            0% { transform: rotate(-5deg) scale(1); }
            100% { transform: rotate(-4deg) scale(1.05); text-shadow: 0 0 20px rgba(255, 51, 102, 0.9), 2px 2px 0px #fff; }
        }

    </style>
</head>
<body>

    <!-- Capa del fondo animado (Pétalos y Corazones) -->
    <canvas id="petalsCanvas"></canvas>

    <!-- Tarjeta de contenido -->
    <div class="glass-card">
        
        <div class="images-container">
            <!-- Snoopy abrazando el corazón -->
            <img src="./img/Snoopy-PNG.png" alt="Snoopy con corazón" class="snoopy-img">
        </div>

        <!-- Dedicatoria especial -->
        <div class="dani-name">Para mi hermosa Dani</div>
        
        <h1>¡Feliz día de las flores!</h1>
        <p>T AMO DEMASIADO MI VIDA CASATE CONMIGO HOY MISMO</p>

        <!-- Girasol envuelto para control de escala en móviles -->
        <div class="sunflower-wrapper">
            <div class="sunflower-container" id="sunflower-container">
                <div class="sunflower-center"></div>
                <!-- Los pétalos se agregarán vía JS -->
            </div>
        </div>
        
    </div>

    <script>
        // --- 1. Generación del Girasol en CSS ---
        const sunflowerContainer = document.getElementById('sunflower-container');
        const numPetals = 20; 
        
        for (let i = 0; i < numPetals; i++) {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            const angle = (360 / numPetals) * i;
            petal.style.transform = `rotate(${angle}deg)`;
            sunflowerContainer.appendChild(petal);
        }

        // --- 2. Sistema de Partículas Canvas (Lluvia de Pétalos y Corazones Amarillos) ---
        const canvas = document.getElementById('petalsCanvas');
        const ctx = canvas.getContext('2d');
        
        let cw, ch;
        const particlesArray = [];
        
        // Reducimos un poco la cantidad de partículas para ahorrar batería en móviles y evitar sobrecarga visual
        const maxPetals = 45; 
        const maxHearts = 15; 

        function resizeCanvas() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Petal {
            constructor() {
                this.x = Math.random() * cw;
                this.y = Math.random() * ch - ch; 
                this.w = Math.random() * 10 + 8; 
                this.h = Math.random() * 15 + 12; 
                this.speedY = Math.random() * 1.5 + 1; 
                this.speedX = Math.random() * 2 - 1; 
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.04 - 0.02; 
                
                const colors = ['#FFD700', '#FFC107', '#FFEB3B', '#FBC02D', '#FFB300'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 4;
                ctx.shadowColor = this.color;
                
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(this.w / 2, this.h / 3, this.w / 2, (2 * this.h) / 3, 0, this.h);
                ctx.bezierCurveTo(-this.w / 2, (2 * this.h) / 3, -this.w / 2, this.h / 3, 0, 0);
                
                ctx.fill();
                ctx.closePath();
                ctx.restore();
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.angle) * 1.2 + this.speedX; 
                this.angle += this.spin;
                
                if (this.y > ch + this.h) {
                    this.y = -this.h;
                    this.x = Math.random() * cw;
                }
                if (this.x > cw + this.w) this.x = -this.w;
                else if (this.x < -this.w) this.x = cw + this.w;

                this.draw();
            }
        }

        class Heart {
            constructor() {
                this.x = Math.random() * cw;
                this.y = Math.random() * ch + ch; 
                this.size = Math.random() * 8 + 6; 
                this.speedY = -(Math.random() * 1 + 0.5); 
                this.speedX = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.3; 
                const colors = ['rgba(255, 215, 0,', 'rgba(255, 235, 59,', 'rgba(255, 193, 7,'];
                this.baseColor = colors[Math.floor(Math.random() * colors.length)];
                this.pulse = Math.random() * Math.PI;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                const scale = 1 + Math.sin(this.pulse) * 0.15;
                ctx.scale(scale, scale);
                
                ctx.beginPath();
                ctx.fillStyle = `${this.baseColor}${this.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = `${this.baseColor}0.6)`;
                
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(0, -3, -5, -15, -15, -15);
                ctx.bezierCurveTo(-30, -15, -30, -2.5, -30, -2.5);
                ctx.bezierCurveTo(-30, 9, -15, 20.2, 0, 30);
                ctx.bezierCurveTo(15, 20.2, 30, 9, 30, -2.5);
                ctx.bezierCurveTo(30, -2.5, 30, -15, 15, -15);
                ctx.bezierCurveTo(5, -15, 0, -3, 0, 0);
                
                ctx.scale(this.size/30, this.size/30);
                
                ctx.fill();
                ctx.closePath();
                ctx.restore();
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.015) * 0.6 + this.speedX; 
                this.pulse += 0.06;
                
                if (this.y < -50) {
                    this.y = ch + 50;
                    this.x = Math.random() * cw;
                }
                this.draw();
            }
        }

        function initParticles() {
            for (let i = 0; i < maxPetals; i++) particlesArray.push(new Petal());
            for (let i = 0; i < maxHearts; i++) particlesArray.push(new Heart());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, cw, ch);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
